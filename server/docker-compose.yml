services:
  postgres:
    image: postgres:16-alpine
    container_name: landing-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: landing
      POSTGRES_PASSWORD: landing
      POSTGRES_DB: landing
    ports:
      - "5433:5432"
    volumes:
      - landing_pg_data:/var/lib/postgresql/data

volumes:
  landing_pg_data:
